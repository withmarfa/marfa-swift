version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
  - package-ecosystem: "swift"
    directories:
      - "/"
      - "/generator"
    schedule:
      interval: "monthly"
    groups:
      swift-packages:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
