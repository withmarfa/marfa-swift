name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Build, test, codegen freshness
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Codegen freshness
        run: |
          swift run codegen-wire
          if ! git diff --exit-code -- Sources/MymeSDK/Types/Wire/Generated; then
            echo "::error::codegen-wire output is stale. Run 'swift run codegen-wire' (or './scripts/sync-openapi.sh' if the OpenAPI snapshot is behind) locally and commit the delta."
            exit 1
          fi
