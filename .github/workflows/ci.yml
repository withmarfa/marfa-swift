name: CI

on:
  pull_request:
    # No paths-ignore here: a required status check must report on every PR,
    # including docs-only ones, or branch protection blocks the merge.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `validate` (build + full test suite) runs on every PR and every merge to
# main — a change is not validated until its tests have run, and a PR is
# where that has to happen. `freshness` (three codegen regens plus diffs)
# stays main-only: it catches drift in vendored inputs, which a source PR
# cannot introduce, and it costs more than it would pay back per push.
# Caching keyed on `Package.resolved` + source hashes for both jobs.

jobs:
  validate:
    name: Build + test
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Select a Swift 6.2 toolchain
        run: |
          # This package builds with `swift build` and `swift test` only.
          # No xcodebuild, no simulator, no destination. So the requirement is
          # a Swift toolchain at the package's tools version, not Xcode itself.
          #
          # Insisting on Xcode made this a scheduling lottery. The self-hosted
          # runners advertise identical labels, but only some of the machines
          # carry Xcode, so a job landing on the others failed with "No Xcode
          # found in /Applications": an error naming the toolchain when the
          # fact was which runner answered.
          #
          # Prefer Xcode when present, because that is what the hosted macOS
          # images provide and what a developer's machine looks like. Fall back
          # to whatever `swift` is on PATH, which on a Command Line Tools
          # install is a complete toolchain for this package.
          required_major=6
          required_minor=2
          latest=$(ls -1 /Applications/ 2>/dev/null | grep -iE '^Xcode(_[0-9.]+)?\.app$' | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            dev_dir="/Applications/$latest/Contents/Developer"
            echo "Selecting $dev_dir"
            # Export DEVELOPER_DIR for subsequent steps. Avoids sudo
            # xcode-select, which needs passwordless sudo on self-hosted
            # runners; works identically on GitHub-hosted macOS images.
            echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
            # Also set it here, so the version assertion below tests the
            # toolchain the later steps will use rather than the one on PATH.
            export DEVELOPER_DIR="$dev_dir"
          else
            echo "No Xcode in /Applications; using the toolchain on PATH."
          fi

          # Whichever was chosen, assert it can actually build this package.
          # A silent fall-through to an old toolchain would fail later and
          # somewhere less obvious.
          version_line=$(swift --version 2>&1 | grep -oE 'Apple Swift version [0-9]+\.[0-9]+' | head -1)
          echo "  ${version_line:-unknown Swift version}"
          have=$(sed -E 's/.*version ([0-9]+)\.([0-9]+).*/\1 \2/' <<<"$version_line")
          have_major=${have% *}; have_minor=${have#* }
          if [[ -z "$version_line" ]] \
             || (( have_major < required_major )) \
             || (( have_major == required_major && have_minor < required_minor )); then
            echo "::error::This runner has ${version_line:-no usable Swift}, and the package needs ${required_major}.${required_minor} or newer."
            exit 1
          fi

      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          # Scope by runner.name. Self-hosted runners on the same host share
          # the cache backend, but each runner's working dir is baked into
          # compiled PCMs; a cross-runner restore surfaces as "missing
          # required module 'SwiftShims'". Per-runner keys keep each runner
          # reading its own correctly-pathed cache. GitHub-hosted runners get
          # a stable runner.name per OS, so the keys still hit cache there.
          path: .build/checkouts
          key: ${{ runner.name }}-spm-checkouts-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.name }}-spm-checkouts-

      - name: Cache SPM build artifacts
        uses: actions/cache@v6
        with:
          # Cache the whole .build directory (except checkouts, cached
          # separately with a finer key). Keyed by Package.resolved +
          # the hash of all Swift sources, so source-only edits still
          # get an incremental-compile hit and dependency bumps miss
          # cleanly. Per-runner scoping for the same reason as the
          # checkouts cache above.
          path: |
            .build
            !.build/checkouts
          key: ${{ runner.name }}-spm-build-${{ hashFiles('Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.name }}-spm-build-${{ hashFiles('Package.resolved') }}-
            ${{ runner.name }}-spm-build-

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

  freshness:
    name: Codegen freshness
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Select a Swift 6.2 toolchain
        run: |
          # This package builds with `swift build` and `swift test` only.
          # No xcodebuild, no simulator, no destination. So the requirement is
          # a Swift toolchain at the package's tools version, not Xcode itself.
          #
          # Insisting on Xcode made this a scheduling lottery. The self-hosted
          # runners advertise identical labels, but only some of the machines
          # carry Xcode, so a job landing on the others failed with "No Xcode
          # found in /Applications": an error naming the toolchain when the
          # fact was which runner answered.
          #
          # Prefer Xcode when present, because that is what the hosted macOS
          # images provide and what a developer's machine looks like. Fall back
          # to whatever `swift` is on PATH, which on a Command Line Tools
          # install is a complete toolchain for this package.
          required_major=6
          required_minor=2
          latest=$(ls -1 /Applications/ 2>/dev/null | grep -iE '^Xcode(_[0-9.]+)?\.app$' | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            dev_dir="/Applications/$latest/Contents/Developer"
            echo "Selecting $dev_dir"
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dev_dir" swift --version

      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          # Per-runner scoping, same reason as the validate job above.
          path: .build/checkouts
          key: ${{ runner.name }}-spm-checkouts-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.name }}-spm-checkouts-

      - name: Cache SPM build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .build
            !.build/checkouts
          key: ${{ runner.name }}-spm-build-${{ hashFiles('Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.name }}-spm-build-${{ hashFiles('Package.resolved') }}-
            ${{ runner.name }}-spm-build-

      - name: Codegen freshness (wire types)
        run: |
          swift run codegen-wire
          if ! git diff --exit-code -- Sources/MarfaSDK/Types/Wire/Generated; then
            echo "::error::codegen-wire output is stale. Run 'swift run codegen-wire' (or './scripts/sync-openapi.sh' if the OpenAPI snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (domain models)
        run: |
          swift run codegen-domain
          if ! git diff --exit-code -- Sources/MarfaSDK/DomainModels/Generated; then
            echo "::error::codegen-domain output is stale. Run 'swift run codegen-domain' (or './scripts/sync-types.sh' if the core-types snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (custom-types fixtures)
        # Two-stage check.
        #
        # Stage 1 regenerates Tests/CodegenCustomTypesTests/Fixtures/expected/
        # from Fixtures/schemas/ via codegen-custom-types and diffs the result
        # against the committed expected/ files. Catches emitter drift and
        # schema edits that weren't accompanied by a regen.
        #
        # Stage 2 byte-compares Fixtures/expected/ against
        # Tests/CodegenCustomTypesTests/CompileCheck/ — a hand-maintained
        # mirror used as a compile-time check. Catches the failure mode where
        # someone edits one copy and forgets the other (GoldenTests only
        # reads expected/, so divergence here ships silently otherwise).
        #
        # The schemas are copied to a temp dir under a folder named
        # `MarfaTypes` because the codegen embeds the source path into each
        # file's header comment (e.g. `// Source: MarfaTypes/foo.json`).
        # Pointing source.directory at the in-repo schemas dir would change
        # that header and produce false-positive drift on every run.
        # GoldenTests uses the same MarfaTypes-copy pattern.
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/MarfaTypes"
          cp Tests/CodegenCustomTypesTests/Fixtures/schemas/*.json "$tmpdir/MarfaTypes/"
          cat > "$tmpdir/marfa-codegen.json" <<JSON
          {
            "schema": 1,
            "source": {
              "mode": "local",
              "directory": "MarfaTypes"
            },
            "output": {
              "directory": "$GITHUB_WORKSPACE/Tests/CodegenCustomTypesTests/Fixtures/expected",
              "accessLevel": "public"
            }
          }
          JSON
          swift run codegen-custom-types --config "$tmpdir/marfa-codegen.json"

          if ! git diff --exit-code -- Tests/CodegenCustomTypesTests/Fixtures/expected; then
            echo "::error::codegen-custom-types fixtures are stale. Run the regen procedure documented in Tests/CodegenCustomTypesTests/CompileCheckTests.swift locally and commit the delta."
            exit 1
          fi

          drift=0
          for f in Tests/CodegenCustomTypesTests/Fixtures/expected/*.swift; do
            base="$(basename "$f")"
            if ! cmp -s "$f" "Tests/CodegenCustomTypesTests/CompileCheck/$base"; then
              echo "::error::CompileCheck/$base diverges from Fixtures/expected/$base. CompileCheck is a byte-for-byte mirror of expected — refresh per Tests/CodegenCustomTypesTests/CompileCheckTests.swift and commit."
              drift=1
            fi
          done
          [[ $drift -eq 0 ]] || exit 1
