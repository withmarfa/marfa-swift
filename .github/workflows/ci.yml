name: CI

on:
  # A draft runs only the quick checks, none of them on a Mac; marking it ready
  # for review runs the rest, and so does every push after that. `Full CI` is
  # the required check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A draft and a ready pull request have groups of their own. A draft pushed and
# marked ready a moment later starts two runs, and in one group the later
# queued cancels the other, which can leave `Full CI` unreported. A push to
# `main` gets a group of its own, so a later push never cancels its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `Build + test` runs only when `scripts/ci-changes.sh` says the change can
  # affect it, on a pull request and on a push to main alike. A skipped job
  # satisfies a required check, where a workflow filtered out by `paths` would
  # leave it pending. A draft never runs it.
  # A push is classified only when the commit before it had a green run of this
  # workflow, which the script asks the API for, hence `actions: read`.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      validate: ${{ steps.classify.outputs.validate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-changes.sh

  # Format lint without a Mac, so a mistake in formatting costs seconds and no
  # macOS runner, and a pull request that fails it never starts `Build + test`.
  # The image is the Swift release Xcode 27 ships. `--portable` leaves out the
  # one rule that answers differently on Linux, which `Build + test` checks.
  lint:
    name: Lint Swift
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/lint.sh --portable

  # On every change, since `Build + test` skips one only to `.github/`, and
  # `release.yml` runs only from main.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actionlint checks each `run:` with the runner's shellcheck.
      - name: Lint workflows and scripts
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
          shellcheck scripts/*.sh
      - name: Test the retry and failure reports
        run: |
          scripts/retried-tests.test.sh
          scripts/report-pin-bump-failure.test.sh

  # Not on a draft, and on a pull request not until `Lint Swift` has passed. A
  # push to `main` runs it whatever the lint said, so its verdict is the whole
  # of what is wrong; `Full CI` fails on the lint alone.
  validate:
    name: Build + test
    needs: [changes, lint]
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && (needs.changes.result != 'success' || needs.changes.outputs.validate != 'false')
      && (github.event_name != 'pull_request' || needs.lint.result == 'success') }}
    runs-on: xcode-27
    # Twice the 90th percentile of a run that builds the core (23 minutes).
    timeout-minutes: 45
    # Inside the workspace: actions/cache refuses a path with `..` in it.
    env:
      MARFA_MONOREPO: ${{ github.workspace }}/.build/marfa
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/core-target
      MARFA_GENERATOR_BUILD: ${{ github.workspace }}/.build/generator-build
    steps:
      - uses: actions/checkout@v7

      # Never a beta beside it.
      - name: Select Xcode
        run: |
          if [[ ! -d /Applications/Xcode.app ]]; then
            echo "::error::This hosted runner has no /Applications/Xcode.app."
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      # Every rule, on the Mac's swift-format; `Lint Swift` ran the rest.
      - name: Lint
        run: scripts/lint.sh

      - name: Test which changes run this job
        run: scripts/ci-changes.test.sh

      - name: Test the release steps
        run: scripts/release.test.sh

      - name: Test the pin bump decision
        run: scripts/pin-bump.test.sh

      - name: Test the pull request description check
        run: scripts/check-pr-description.test.sh

      - name: Read the pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < core.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the core at the pin
        uses: actions/checkout@v7
        with:
          repository: withmarfa/marfa
          ref: ${{ steps.pin.outputs.sha }}
          path: .build/marfa

      - name: Install sample project generator
        run: brew install xcodegen

      # Emptied first, so a committed file the pin does not generate shows as
      # deleted whatever comes next.
      - name: Empty what the core generates
        run: rm -rf Sources/MarfaCore Sources/MarfaTypes Sources/MarfaAPI/Generated

      # What core.sh makes depends only on the pin, the script and the
      # generator, so a change that leaves them alone reuses what it made
      # last time and builds no Rust. `pin-bump.yml` saves it from `main` for
      # each new pin, which every pull request can read, so the first pull
      # request after a bump hits it. The caches here are all small: a cargo
      # build folder is 1.7 GB, and two of them evicted these.
      - name: Restore what the pin generates
        id: core
        uses: actions/cache@v6
        with:
          path: |
            Frameworks/MarfaCoreFFI.xcframework
            Sources/MarfaCore
            Sources/MarfaTypes
            Sources/MarfaAPI/Generated
          key: core-output-${{ runner.os }}-${{ hashFiles('core.pin', 'scripts/core.sh', 'generator/**') }}

      - name: Add the iOS targets
        if: ${{ steps.core.outputs.cache-hit != 'true' }}
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # The version is in the core's build script, so the key follows it.
      - name: Cache the tool that packages the core
        if: ${{ steps.core.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-swift
          key: cargo-swift-${{ runner.os }}-${{ hashFiles('.build/marfa/core/bindings/swift/build.sh') }}
      - name: Cache the generator's build
        if: ${{ steps.core.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.build/generator-build
          key: generator-${{ runner.os }}-${{ hashFiles('generator/Package.resolved') }}
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: .build/marfa/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .build/marfa/pnpm-lock.yaml
      - name: Build the core at the pin
        if: ${{ steps.core.outputs.cache-hit != 'true' }}
        run: scripts/core.sh

      # The folder tests hold the package's registry to the one `marfa folders list` reads. Its own target
      # directory, so it never starts behind the core's. Only the binary is cached, like the core's output.
      - name: Restore the command line the pin builds
        id: cli
        uses: actions/cache@v6
        with:
          path: .build/marfa-cli
          key: marfa-cli-${{ runner.os }}-${{ hashFiles('core.pin') }}
      - name: Build the command line at the pin
        if: ${{ steps.cli.outputs.cache-hit != 'true' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.build/cli-target
        run: |
          cargo build --locked -p marfa-cli --manifest-path "${MARFA_MONOREPO}/core/Cargo.toml"
          mkdir -p .build/marfa-cli
          cp "${CARGO_TARGET_DIR}/debug/marfa" .build/marfa-cli/marfa

      - name: Test wire generation
        run: |
          if [[ -x "${MARFA_GENERATOR_BUILD}/release/swift-openapi-generator" ]]; then
            export MARFA_GENERATOR_BIN="${MARFA_GENERATOR_BUILD}/release/swift-openapi-generator"
          fi
          node --test generator/generate.test.mjs

      - name: Check what the pin generates
        run: |
          if [[ -n "$(git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes Sources/MarfaAPI/Generated)" ]]; then
            git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes Sources/MarfaAPI/Generated
            echo "::error::The glue, the wire types or the client are not what the pinned commit generates. Run scripts/core.sh and commit them."
            exit 1
          fi

      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - name: Build the server at the pin
        working-directory: .build/marfa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@withmarfa/server..." build

      - name: Build and test against a booted server
        env:
          MARFA_LIVE_REQUIRED: '1'
        run: |
          set -euo pipefail
          # Before the boot: one that fails partway has already started a server.
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-swift-live.env"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned first, because `eval` of an empty string would hide a failed boot.
          server_env="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"
          eval "${server_env}"
          export MARFA_API_URL="${MARFA_TEST_URL}" MARFA_API_KEY="${MARFA_TEST_KEY}"
          export MARFA_CLI="${GITHUB_WORKSPACE}/.build/marfa-cli/marfa"
          swift build 2>&1 | tee "${RUNNER_TEMP}/swift-build.log"
          # What the package writes by hand builds without a warning. The generated wire types are out of
          # this check: their warnings come from the pinned generator, and `scripts/core.sh` rewrites them.
          # The build colors its diagnostics, which puts escape codes between the position and `warning:`.
          if sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "${RUNNER_TEMP}/swift-build.log" | grep -E '^[^ ]+: warning: ' | grep -v -e '/Sources/MarfaTypes/' -e '/Sources/MarfaAPI/Generated/'; then
            echo "::error::The package builds with warnings."
            exit 1
          fi
          # The service is read from the tests, so the two cannot differ.
          service="$(sed -n 's/^ *let service = "\(.*\)"$/\1/p' Tests/MarfaTests/CredentialTests.swift)"
          [[ "${service}" =~ ^[a-z.-]+$ ]] || { echo "::error::CredentialTests.swift names no one service"; exit 1; }
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-before"
          # A test that fails is run once more. One that then passes is flaky: it does not fail the run, and
          # the summary names it. One that fails twice fails the run. The keychain is compared either way.
          tested=0
          swift test --repeat-until pass --maximum-repetitions 2 2>&1 | tee "${RUNNER_TEMP}/swift-test.log" || tested=$?
          retried="$(scripts/retried-tests.sh <"${RUNNER_TEMP}/swift-test.log")"
          if [[ -n "${retried}" ]]; then
            while IFS= read -r name; do echo "::warning title=Flaky test::${name} failed and was run once more"; done <<<"${retried}"
            {
              echo "### Tests that ran twice"
              echo
              echo "Each failed once. One that passed the second time is flaky and did not fail this run; fix it."
              echo
              while IFS= read -r name; do echo "- \`${name}\`"; done <<<"${retried}"
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-after"
          if ! diff "${RUNNER_TEMP}/login-keychain-before" "${RUNNER_TEMP}/login-keychain-after"; then
            echo "::error::The tests changed the login keychain under ${service}."
            exit 1
          fi
          exit "${tested}"

      - name: Build the sample for macOS and the iOS simulator
        working-directory: Examples/MarfaSample
        run: |
          xcodegen generate --quiet
          for target in 'MarfaSample-macOS|generic/platform=macOS' 'MarfaSample-iOS|generic/platform=iOS Simulator'; do
            xcodebuild -quiet -project MarfaSample.xcodeproj \
              -scheme "${target%%|*}" -destination "${target#*|}" \
              -derivedDataPath "${RUNNER_TEMP}/marfa-sample" build
          done

      - name: Run the sample's scenario offline and back
        run: |
          set -euo pipefail
          sample="${RUNNER_TEMP}/marfa-sample/Build/Products/Debug/MarfaSample.app/Contents/MacOS/MarfaSample"
          export MARFA_SERVER_KEEP="${RUNNER_TEMP}/marfa-scenario-server"
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-scenario.env"
          store="${RUNNER_TEMP}/marfa-scenario/notes.sqlite"
          mkdir -p "$(dirname "${store}")"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          up() { local env_text; env_text="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"; eval "${env_text}"; }
          phase() { "${sample}" --scenario "$1" --server "${MARFA_TEST_URL}" --key "${MARFA_TEST_KEY}" --store "${store}"; }
          up
          phase hydrate
          "${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}"
          phase write
          up
          phase drain
          phase catch-up

      # Only a failed run keeps them, for three days.
      - name: Keep the logs of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            ${{ runner.temp }}/swift-build.log
            ${{ runner.temp }}/swift-test.log
          if-no-files-found: ignore
          retention-days: 3

  # The one required check, since a skipped job passes a required check and a
  # draft skips most of `Build + test`. On a draft this job is `Draft CI`, so
  # the required `Full CI` stays expected, and blocks a merge, until the run
  # that marking it ready starts has finished every job. A skipped job keeps
  # its name unevaluated, so it can never report as `Full CI`: a run that is
  # cancelled skips this job, so a cancel can never leave `Full CI` green, and
  # a failed job still runs it, and it fails.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs: [changes, lint, lint-workflows, validate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
