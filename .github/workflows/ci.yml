name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tiered validation pattern.
#
# macOS runners are 10x Ubuntu on GitHub Actions billing. Before this split
# the full test suite + freshness checks ran on every PR push, driving ~$5/mo
# of the org's CI bill from this repo alone. The decision and rationale live
# in `~/aic-vault/Projects/myme-A1ZB0/Artifacts/32-state-of-play/CI Actions Review.md`.
#
# - PR tier (`pr-check`): compile + typecheck only. Fast feedback on every
#   push. Catches ~the same class of breakage at ~30% the cost.
# - Main tier (`main-validate`): full build + `swift test --parallel` +
#   three codegen freshness checks (wire types, domain models, custom-types
#   fixtures). Runs on merge to main and on manual workflow_dispatch.
#   Breakages are a "fix main before cutting a tag" signal, not an
#   incident — nothing auto-deploys from main.
#
# Caching is applied to both tiers: SPM checkouts + DerivedData. Cache key
# includes Package.resolved so a dependency bump gets a fresh build, but
# iterative source-only changes hit cache warm.
#
# If this repo ever ships externally (App Store, public SDK consumers),
# revisit: PR-time safety may need to trade back against cost.

jobs:
  pr-check:
    name: PR check (compile + typecheck)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (for Swift 6.2)
        run: |
          latest=$(ls -1 /Applications/ | grep -iE '^Xcode(_[0-9.]+)?\.app$' | sort -V | tail -1)
          if [[ -z "$latest" ]]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          dev_dir="/Applications/$latest/Contents/Developer"
          echo "Selecting $dev_dir"
          # Export DEVELOPER_DIR for subsequent steps. Avoids sudo xcode-select
          # which requires passwordless sudo on self-hosted runners; works
          # identically on GitHub-hosted macOS runners.
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dev_dir" swift --version

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-spm-checkouts-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-checkouts-

      - name: Cache SPM build artefacts
        uses: actions/cache@v4
        with:
          # Cache the whole .build directory (except checkouts, cached
          # separately with a finer key). Keyed by Package.resolved +
          # the hash of all Swift sources, so source-only edits still
          # get an incremental-compile hit and dependency bumps miss
          # cleanly.
          path: |
            .build
            !.build/checkouts
          key: ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-spm-build-

      - name: Compile library + tests (typecheck, no test run)
        # `swift build --build-tests` compiles test targets too, which
        # exercises the full type surface without actually running tests.
        # This is the cheap pre-merge signal.
        run: swift build --build-tests

  main-validate:
    name: Full build + test + freshness
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (for Swift 6.2)
        run: |
          latest=$(ls -1 /Applications/ | grep -iE '^Xcode(_[0-9.]+)?\.app$' | sort -V | tail -1)
          if [[ -z "$latest" ]]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          dev_dir="/Applications/$latest/Contents/Developer"
          echo "Selecting $dev_dir"
          # Export DEVELOPER_DIR for subsequent steps. Avoids sudo xcode-select
          # which requires passwordless sudo on self-hosted runners; works
          # identically on GitHub-hosted macOS runners.
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dev_dir" swift --version

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-spm-checkouts-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-checkouts-

      - name: Cache SPM build artefacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            !.build/checkouts
          key: ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-spm-build-

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Codegen freshness (wire types)
        run: |
          swift run codegen-wire
          if ! git diff --exit-code -- Sources/MymeSDK/Types/Wire/Generated; then
            echo "::error::codegen-wire output is stale. Run 'swift run codegen-wire' (or './scripts/sync-openapi.sh' if the OpenAPI snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (domain models)
        run: |
          swift run codegen-domain
          if ! git diff --exit-code -- Sources/MymeSDK/DomainModels/Generated; then
            echo "::error::codegen-domain output is stale. Run 'swift run codegen-domain' (or './scripts/sync-types.sh' if the core-types snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (custom-types fixtures)
        # Two-stage check.
        #
        # Stage 1 regenerates Tests/CodegenCustomTypesTests/Fixtures/expected/
        # from Fixtures/schemas/ via codegen-custom-types and diffs the result
        # against the committed expected/ files. Catches emitter drift and
        # schema edits that weren't accompanied by a regen.
        #
        # Stage 2 byte-compares Fixtures/expected/ against
        # Tests/CodegenCustomTypesTests/CompileCheck/ — a hand-maintained
        # mirror used as a compile-time check. Catches the failure mode where
        # someone edits one copy and forgets the other (GoldenTests only
        # reads expected/, so divergence here ships silently otherwise).
        #
        # The schemas are copied to a temp dir under a folder named
        # `MymeTypes` because the codegen embeds the source path into each
        # file's header comment (e.g. `// Source: MymeTypes/foo.json`).
        # Pointing source.directory at the in-repo schemas dir would change
        # that header and produce false-positive drift on every run.
        # GoldenTests uses the same MymeTypes-copy pattern.
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/MymeTypes"
          cp Tests/CodegenCustomTypesTests/Fixtures/schemas/*.json "$tmpdir/MymeTypes/"
          cat > "$tmpdir/myme-codegen.json" <<JSON
          {
            "schema": 1,
            "source": {
              "mode": "local",
              "directory": "MymeTypes"
            },
            "output": {
              "directory": "$GITHUB_WORKSPACE/Tests/CodegenCustomTypesTests/Fixtures/expected",
              "accessLevel": "public"
            }
          }
          JSON
          swift run codegen-custom-types --config "$tmpdir/myme-codegen.json"

          if ! git diff --exit-code -- Tests/CodegenCustomTypesTests/Fixtures/expected; then
            echo "::error::codegen-custom-types fixtures are stale. Run the regen procedure documented in Tests/CodegenCustomTypesTests/CompileCheckTests.swift locally and commit the delta."
            exit 1
          fi

          drift=0
          for f in Tests/CodegenCustomTypesTests/Fixtures/expected/*.swift; do
            base="$(basename "$f")"
            if ! cmp -s "$f" "Tests/CodegenCustomTypesTests/CompileCheck/$base"; then
              echo "::error::CompileCheck/$base diverges from Fixtures/expected/$base. CompileCheck is a byte-for-byte mirror of expected — refresh per Tests/CodegenCustomTypesTests/CompileCheckTests.swift and commit."
              drift=1
            fi
          done
          [[ $drift -eq 0 ]] || exit 1
