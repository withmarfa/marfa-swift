name: CI

on:
  # A draft runs only the quick checks; marking it ready for review runs the
  # rest, and so does every push after that. `Full CI` is the required check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `Build + test` runs only when `scripts/ci-changes.sh` says the change can
  # affect it, on a pull request and on a push to main alike. A skipped job
  # satisfies a required check, where a workflow filtered out by `paths` would
  # leave it pending. A draft that changes it runs it only as far as the lint.
  # A push is classified only when the commit before it had a green run of this
  # workflow, which the script asks the API for, hence `actions: read`.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      validate: ${{ steps.classify.outputs.validate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-changes.sh

  # On every change, since `Build + test` skips one only to `.github/`, and
  # `release.yml` runs only from main.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actionlint checks each `run:` with the runner's shellcheck.
      - name: Lint workflows and scripts
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
          shellcheck scripts/*.sh

  validate:
    name: Build + test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.validate != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 60
    # Inside the workspace: actions/cache refuses a path with `..` in it.
    env:
      MARFA_MONOREPO: ${{ github.workspace }}/.build/marfa
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/core-target
      MARFA_GENERATOR_BUILD: ${{ github.workspace }}/.build/generator-build
    steps:
      - uses: actions/checkout@v7

      # Never a beta beside it.
      - name: Select Xcode
        run: |
          if [[ ! -d /Applications/Xcode.app ]]; then
            echo "::error::This hosted runner has no /Applications/Xcode.app."
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          swift format lint --strict --configuration .swift-format -r \
            Package.swift Sources/Marfa Tests Examples/MarfaSample/Sources generator/MarfaNullValue.swift generator/MarfaNullable.swift

      # The steps from here on are for a pull request that is ready for
      # review and for a push. A draft ends here and passes; `Full CI`, named
      # `Draft CI` for a draft, keeps it from merging.
      - name: Test which changes run this job
        if: ${{ !github.event.pull_request.draft }}
        run: scripts/ci-changes.test.sh

      - name: Test the release steps
        if: ${{ !github.event.pull_request.draft }}
        run: scripts/release.test.sh

      - name: Test the pin bump decision
        if: ${{ !github.event.pull_request.draft }}
        run: scripts/pin-bump.test.sh

      - name: Test the pull request description check
        if: ${{ !github.event.pull_request.draft }}
        run: scripts/check-pr-description.test.sh

      - name: Read the pin
        id: pin
        if: ${{ !github.event.pull_request.draft }}
        run: echo "sha=$(tr -d '[:space:]' < core.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the core at the pin
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@v7
        with:
          repository: withmarfa/marfa
          ref: ${{ steps.pin.outputs.sha }}
          path: .build/marfa

      - name: Install sample project generator
        if: ${{ !github.event.pull_request.draft }}
        run: brew install xcodegen

      # Emptied first, so a committed file the pin does not generate shows as
      # deleted whatever comes next.
      - name: Empty what the core generates
        if: ${{ !github.event.pull_request.draft }}
        run: rm -rf Sources/MarfaCore Sources/MarfaTypes

      # What core.sh makes depends only on the pin, the script and the
      # generator, so a change that leaves them alone reuses what it made
      # last time and builds no Rust.
      - name: Restore what the pin generates
        id: core
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/cache@v6
        with:
          path: |
            Frameworks/MarfaCoreFFI.xcframework
            Sources/MarfaCore
            Sources/MarfaTypes
          key: core-output-${{ runner.os }}-${{ hashFiles('core.pin', 'scripts/core.sh', 'generator/**') }}

      - name: Add the iOS targets
        if: ${{ !github.event.pull_request.draft && steps.core.outputs.cache-hit != 'true' }}
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Cache the core's build
        if: ${{ !github.event.pull_request.draft && steps.core.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-swift
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/.build/core-target
          key: core-${{ runner.os }}-${{ hashFiles('core.pin') }}
          restore-keys: core-${{ runner.os }}-
      - name: Cache the generator's build
        if: ${{ !github.event.pull_request.draft && steps.core.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.build/generator-build
          key: generator-${{ runner.os }}-${{ hashFiles('generator/Package.resolved') }}
      - if: ${{ !github.event.pull_request.draft }}
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: .build/marfa/package.json
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .build/marfa/pnpm-lock.yaml
      - name: Build the core at the pin
        if: ${{ !github.event.pull_request.draft && steps.core.outputs.cache-hit != 'true' }}
        run: scripts/core.sh

      # The folder tests hold the package's registry to the one `marfa folders list` reads. Its own target
      # directory and cache, so it never starts cold behind a core cache hit or swells the core's cache.
      - name: Restore the command line the pin builds
        id: cli
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/cache@v6
        with:
          path: .build/marfa-cli
          key: marfa-cli-${{ runner.os }}-${{ hashFiles('core.pin') }}
      - name: Cache the command line's build
        if: ${{ !github.event.pull_request.draft && steps.cli.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/.build/cli-target
          key: cli-build-${{ runner.os }}-${{ hashFiles('core.pin') }}
          restore-keys: cli-build-${{ runner.os }}-
      - name: Build the command line at the pin
        if: ${{ !github.event.pull_request.draft && steps.cli.outputs.cache-hit != 'true' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.build/cli-target
        run: |
          cargo build --locked -p marfa-cli --manifest-path "${MARFA_MONOREPO}/core/Cargo.toml"
          mkdir -p .build/marfa-cli
          cp "${CARGO_TARGET_DIR}/debug/marfa" .build/marfa-cli/marfa

      - name: Test wire generation
        if: ${{ !github.event.pull_request.draft }}
        run: |
          if [[ -x "${MARFA_GENERATOR_BUILD}/release/swift-openapi-generator" ]]; then
            export MARFA_GENERATOR_BIN="${MARFA_GENERATOR_BUILD}/release/swift-openapi-generator"
          fi
          node --test generator/generate.test.mjs

      - name: Check what the pin generates
        if: ${{ !github.event.pull_request.draft }}
        run: |
          if [[ -n "$(git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes)" ]]; then
            git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes
            echo "::error::The glue or the wire types are not what the pinned commit generates. Run scripts/core.sh and commit them."
            exit 1
          fi

      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - name: Build the server at the pin
        if: ${{ !github.event.pull_request.draft }}
        working-directory: .build/marfa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@withmarfa/server..." build

      - name: Build and test against a booted server
        if: ${{ !github.event.pull_request.draft }}
        env:
          MARFA_LIVE_REQUIRED: '1'
        run: |
          set -euo pipefail
          # Before the boot: one that fails partway has already started a server.
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-swift-live.env"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned first, because `eval` of an empty string would hide a failed boot.
          server_env="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"
          eval "${server_env}"
          export MARFA_API_URL="${MARFA_TEST_URL}" MARFA_API_KEY="${MARFA_TEST_KEY}"
          export MARFA_CLI="${GITHUB_WORKSPACE}/.build/marfa-cli/marfa"
          swift build 2>&1 | tee "${RUNNER_TEMP}/swift-build.log"
          # What the package writes by hand builds without a warning. The generated wire types are out of
          # this check: their warnings come from the pinned generator, and `scripts/core.sh` rewrites them.
          if grep -E '^[^ ]+: warning: ' "${RUNNER_TEMP}/swift-build.log" | grep -v '/Sources/MarfaTypes/'; then
            echo "::error::The package builds with warnings."
            exit 1
          fi
          # The service is read from the tests, so the two cannot differ.
          service="$(sed -n 's/^ *let service = "\(.*\)"$/\1/p' Tests/MarfaTests/CredentialTests.swift)"
          [[ "${service}" =~ ^[a-z.-]+$ ]] || { echo "::error::CredentialTests.swift names no one service"; exit 1; }
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-before"
          # Compared whether the suite passed or not.
          tested=0
          swift test || tested=$?
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-after"
          if ! diff "${RUNNER_TEMP}/login-keychain-before" "${RUNNER_TEMP}/login-keychain-after"; then
            echo "::error::The tests changed the login keychain under ${service}."
            exit 1
          fi
          exit "${tested}"

      - name: Build the sample for macOS and the iOS simulator
        if: ${{ !github.event.pull_request.draft }}
        working-directory: Examples/MarfaSample
        run: |
          xcodegen generate --quiet
          for target in 'MarfaSample-macOS|generic/platform=macOS' 'MarfaSample-iOS|generic/platform=iOS Simulator'; do
            xcodebuild -quiet -project MarfaSample.xcodeproj \
              -scheme "${target%%|*}" -destination "${target#*|}" \
              -derivedDataPath "${RUNNER_TEMP}/marfa-sample" build
          done

      - name: Run the sample's scenario offline and back
        if: ${{ !github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          sample="${RUNNER_TEMP}/marfa-sample/Build/Products/Debug/MarfaSample.app/Contents/MacOS/MarfaSample"
          export MARFA_SERVER_KEEP="${RUNNER_TEMP}/marfa-scenario-server"
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-scenario.env"
          store="${RUNNER_TEMP}/marfa-scenario/notes.sqlite"
          mkdir -p "$(dirname "${store}")"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          up() { local env_text; env_text="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"; eval "${env_text}"; }
          phase() { "${sample}" --scenario "$1" --server "${MARFA_TEST_URL}" --key "${MARFA_TEST_KEY}" --store "${store}"; }
          up
          phase hydrate
          "${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}"
          phase write
          up
          phase drain
          phase catch-up

  # The one required check, since a skipped job passes a required check and a
  # draft skips most of `Build + test`. On a draft this job is `Draft CI`, so
  # the required `Full CI` stays expected, and blocks a merge, until the run
  # that marking it ready starts has finished every job. A skipped job keeps
  # its name unevaluated, so it can never report as `Full CI`.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs: [changes, lint-workflows, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
