name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's next push supersedes the run before it. On `main` every
# merge keeps its own run, because a shared group would drop commits that land
# close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Build + test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MARFA_MONOREPO: ${{ github.workspace }}/.build/marfa
      CARGO_TARGET_DIR: ${{ github.workspace }}/../core-target
      MARFA_GENERATOR_BUILD: ${{ github.workspace }}/../generator-build
    steps:
      - uses: actions/checkout@v7

      - name: Read the pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < core.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the core at the pin
        uses: actions/checkout@v7
        with:
          repository: withmarfa/marfa
          ref: ${{ steps.pin.outputs.sha }}
          path: .build/marfa

      # The release Xcode, never a beta beside it.
      - name: Select Xcode
        run: |
          if [[ ! -d /Applications/Xcode.app ]]; then
            echo "::error::This hosted runner has no /Applications/Xcode.app."
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install sample project generator
        run: brew install xcodegen

      - name: Lint
        run: |
          swift format lint --strict --configuration .swift-format -r \
            Package.swift Sources/Marfa Sources/MarfaCoreNames Tests Examples/MarfaSample/Sources

      - name: Add the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # Both generated sources are held to the pin: the glue and the wire
      # types. Their directories are emptied here as well as by core.sh, so a
      # committed file the pinned commit does not generate shows as deleted
      # whatever core.sh leaves.
      - name: Build the core and check what it generates
        run: |
          rm -rf Sources/MarfaCore Sources/MarfaTypes
          scripts/core.sh
          if [[ -n "$(git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes)" ]]; then
            git status --porcelain -- Sources/MarfaCore Sources/MarfaTypes
            echo "::error::The glue or the wire types are not what the pinned commit generates. Run scripts/core.sh and commit them."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: .build/marfa/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - name: Build the server at the pin
        working-directory: .build/marfa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@withmarfa/server..." build

      - name: Build and test against a booted server
        env:
          MARFA_LIVE_REQUIRED: '1'
        run: |
          set -euo pipefail
          # The trap goes in before the boot: a boot that fails partway has
          # already started a server, and a later trap would never stop it.
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-swift-live.env"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned before it is evaluated, because `eval` of an empty string
          # succeeds and would hide a failed boot.
          server_env="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"
          eval "${server_env}"
          export MARFA_API_URL="${MARFA_TEST_URL}" MARFA_API_KEY="${MARFA_TEST_KEY}"
          swift build
          # The tests keep keys in keychains of their own; the login keychain
          # is the person's and holds after the suite what it held before it,
          # under the service the tests use, read from them so the two cannot
          # name different services.
          service="$(sed -n 's/^ *let service = "\(.*\)"$/\1/p' Tests/MarfaTests/CredentialTests.swift)"
          [[ "${service}" =~ ^[a-z.-]+$ ]] || { echo "::error::CredentialTests.swift names no one service"; exit 1; }
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-before"
          # Compared whether the suite passed or not, since a failing run is
          # as able to leave an item behind.
          tested=0
          swift test || tested=$?
          scripts/login-keychain.sh "${service}" >"${RUNNER_TEMP}/login-keychain-after"
          if ! diff "${RUNNER_TEMP}/login-keychain-before" "${RUNNER_TEMP}/login-keychain-after"; then
            echo "::error::The tests changed the login keychain under ${service}."
            exit 1
          fi
          exit "${tested}"

      - name: Build the sample for macOS and the iOS simulator
        working-directory: Examples/MarfaSample
        run: |
          xcodegen generate --quiet
          for target in 'MarfaSample-macOS|generic/platform=macOS' 'MarfaSample-iOS|generic/platform=iOS Simulator'; do
            xcodebuild -quiet -project MarfaSample.xcodeproj \
              -scheme "${target%%|*}" -destination "${target#*|}" \
              -derivedDataPath "${RUNNER_TEMP}/marfa-sample" build
          done

      # The sample offline and back: hydrate, write with the server stopped,
      # drain once it is back on the same origin with the same data, and catch
      # up a note made through another working copy.
      - name: Run the sample's scenario offline and back
        run: |
          set -euo pipefail
          sample="${RUNNER_TEMP}/marfa-sample/Build/Products/Debug/MarfaSample.app/Contents/MacOS/MarfaSample"
          export MARFA_SERVER_KEEP="${RUNNER_TEMP}/marfa-scenario-server"
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-scenario.env"
          store="${RUNNER_TEMP}/marfa-scenario/notes.sqlite"
          mkdir -p "$(dirname "${store}")"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          up() { local env_text; env_text="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"; eval "${env_text}"; }
          phase() { "${sample}" --scenario "$1" --server "${MARFA_TEST_URL}" --key "${MARFA_TEST_KEY}" --store "${store}"; }
          up
          phase hydrate
          "${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}"
          phase write
          up
          phase drain
          phase catch-up
