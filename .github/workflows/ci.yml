name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's next push supersedes the run before it. On `main` every
# merge keeps its own run, because a shared group would drop commits that land
# close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Build + test
    # `xcode` because the core's iOS slices and the sample need the iOS SDK,
    # which a Command Line Tools install does not carry.
    runs-on: [self-hosted, macOS, ARM64, xcode, withmarfa]
    timeout-minutes: 60
    env:
      MARFA_MONOREPO: ${{ github.workspace }}/.build/marfa
    steps:
      - uses: actions/checkout@v7

      - name: Read the pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < core.pin)" >> "$GITHUB_OUTPUT"

      # The monorepo is private. SHIPPING_GAP_TOKEN is the organization's
      # secret that reads it; the name is the guard it was first cut for.
      - name: Check out the core at the pin
        uses: actions/checkout@v7
        with:
          repository: withmarfa/marfa
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.SHIPPING_GAP_TOKEN }}
          path: .build/marfa

      - name: Select Xcode
        run: |
          latest=$( { ls -1 /Applications/ | grep -E '^Xcode(_[0-9.]+)?\.app$' | sort -V | tail -1; } || true )
          if [[ -z "$latest" ]]; then
            echo "::error::This runner carries the xcode label and has no Xcode in /Applications."
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/$latest/Contents/Developer" >> "$GITHUB_ENV"

      # Homebrew's rustup is keg-only, so nothing it installs is on the default
      # PATH, and cargo-swift is wherever `cargo install` put it.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build the core and check its glue
        run: |
          scripts/core.sh
          if ! git diff --exit-code -- Sources/MarfaCore/MarfaCore.swift; then
            echo "::error::Sources/MarfaCore/MarfaCore.swift is not what the pinned core generates. Run scripts/core.sh and commit it."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: .build/marfa/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - name: Build the server at the pin
        working-directory: .build/marfa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@withmarfa/server..." build

      - name: Build and test against a booted server
        env:
          MARFA_LIVE_REQUIRED: '1'
        run: |
          set -euo pipefail
          # The trap goes in before the boot: a boot that fails partway has
          # already started a server, and a later trap would never stop it.
          export MARFA_SERVER_ENV="${RUNNER_TEMP}/marfa-swift-live.env"
          trap '"${MARFA_MONOREPO}/core/scripts/server-down.sh" "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned before it is evaluated, because `eval` of an empty string
          # succeeds and would hide a failed boot.
          server_env="$("${MARFA_MONOREPO}/core/scripts/server-up.sh")"
          eval "${server_env}"
          export MARFA_API_URL="${MARFA_TEST_URL}" MARFA_API_KEY="${MARFA_TEST_KEY}"
          swift build
          swift test

      - name: Build the sample for macOS and the iOS simulator
        working-directory: Examples/MarfaSample
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --quiet
          for target in 'MarfaSample-macOS|generic/platform=macOS' 'MarfaSample-iOS|generic/platform=iOS Simulator'; do
            xcodebuild -quiet -project MarfaSample.xcodeproj \
              -scheme "${target%%|*}" -destination "${target#*|}" \
              -derivedDataPath "${RUNNER_TEMP}/marfa-sample" build
          done
