name: CI

on:
  pull_request:
    # No paths-ignore here: a required status check must report on every PR,
    # including docs-only ones, or branch protection blocks the merge.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

# A pull request's next push supersedes the run before it, so cancelling is
# free there. `main` is the opposite: each merge is a distinct commit that
# nothing else will ever validate, and the release workflow tags from `main`.
# A commit whose tests never ran is how a release was once cut from one.
#
# **Turning cancellation off is not enough on its own, and that is the part
# worth knowing.** `cancel-in-progress: false` protects the run that is
# already going; GitHub still keeps only one *pending* run per concurrency
# group and cancels the pending one when a newer arrives. With three merges
# landing close together — the ordinary case here, since agents self-merge on
# green and the pool is contended — the first runs, the second waits, and the
# third cancels the second before it ever starts. The commit is unvalidated
# either way and the only difference is which mechanism dropped it.
#
# So `main` gets a group per commit rather than a shared one, and every merge
# that starts a run gets to finish it. Not every merge starts one: the
# `paths-ignore` below means a documentation-only merge runs no CI at all,
# which is deliberate and is a different thing from a run being dropped.
# Pull requests keep the shared, cancelling group, which is what makes a fast
# follow-up push cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `validate` (build + full test suite) runs on every PR and every merge to
# main, because a change is not validated until its tests have run and a PR
# is where that has to happen. `freshness` (three codegen regens plus diffs)
# stays main-only: it catches drift in vendored inputs, which a source PR
# cannot introduce, and it costs more than it would pay back per push.
#
# Both jobs open with the same prelude: toolchain selection followed by the
# two SPM caches. It lives in .github/actions/swift-toolchain rather than
# being written out twice.

jobs:
  validate:
    name: Build + test
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    # Max observed 6m54s, median 2m01s. The 3.4x spread is contention on the
    # shared pool, so the bound has to clear the max rather than the median.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/swift-toolchain

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      # The changelog is the only place a consumer learns that a version will
      # stop their build, and until now nothing held it to what the version
      # actually did. It runs here rather than in `freshness` because it must
      # report on a pull request: the release workflow fires on the tag push,
      # so anything it caught would already be published, and `freshness` is
      # main-only, which is after the merge that introduced the change.
      #
      # `swift test` above has already built every module, so the extraction
      # below is close to free.
      - name: Public surface accounted for
        run: |
          ./scripts/public-surface.sh "${RUNNER_TEMP}/public-surface-head.txt"
          swift run --quiet public-surface check \
            scripts/public-surface.txt \
            "${RUNNER_TEMP}/public-surface-head.txt" \
            CHANGELOG.md

  freshness:
    name: Codegen freshness
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    # Three codegen regenerations plus a git diff have taken up to 3m50s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/swift-toolchain

      - name: Codegen freshness (wire types)
        run: |
          swift run codegen-wire
          if ! git diff --exit-code -- Sources/MarfaSDK/Types/Wire/Generated; then
            echo "::error::codegen-wire output is stale. Run 'swift run codegen-wire' (or './scripts/sync-openapi.sh' if the OpenAPI snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (domain models)
        run: |
          swift run codegen-domain
          if ! git diff --exit-code -- Sources/MarfaSDK/DomainModels/Generated; then
            echo "::error::codegen-domain output is stale. Run 'swift run codegen-domain' (or './scripts/sync-types.sh' if the core-types snapshot is behind) locally and commit the delta."
            exit 1
          fi

      - name: Codegen freshness (custom-types fixtures)
        # Two-stage check.
        #
        # Stage 1 regenerates Tests/CodegenCustomTypesTests/Fixtures/expected/
        # from Fixtures/schemas/ via codegen-custom-types and diffs the result
        # against the committed expected/ files. Catches emitter drift and
        # schema edits that weren't accompanied by a regen.
        #
        # Stage 2 byte-compares Fixtures/expected/ against
        # Tests/CodegenCustomTypesTests/CompileCheck/ — a hand-maintained
        # mirror used as a compile-time check. Catches the failure mode where
        # someone edits one copy and forgets the other (GoldenTests only
        # reads expected/, so divergence here ships silently otherwise).
        #
        # The schemas are copied to a temp dir under a folder named
        # `MarfaTypes` because the codegen embeds the source path into each
        # file's header comment (e.g. `// Source: MarfaTypes/foo.json`).
        # Pointing source.directory at the in-repo schemas dir would change
        # that header and produce false-positive drift on every run.
        # GoldenTests uses the same MarfaTypes-copy pattern.
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/MarfaTypes"
          cp Tests/CodegenCustomTypesTests/Fixtures/schemas/*.json "$tmpdir/MarfaTypes/"
          cat > "$tmpdir/marfa-codegen.json" <<JSON
          {
            "schema": 1,
            "source": {
              "mode": "local",
              "directory": "MarfaTypes"
            },
            "output": {
              "directory": "$GITHUB_WORKSPACE/Tests/CodegenCustomTypesTests/Fixtures/expected",
              "accessLevel": "public"
            }
          }
          JSON
          swift run codegen-custom-types --config "$tmpdir/marfa-codegen.json"

          if ! git diff --exit-code -- Tests/CodegenCustomTypesTests/Fixtures/expected; then
            echo "::error::codegen-custom-types fixtures are stale. Run the regen procedure documented in Tests/CodegenCustomTypesTests/CompileCheckTests.swift locally and commit the delta."
            exit 1
          fi

          drift=0
          for f in Tests/CodegenCustomTypesTests/Fixtures/expected/*.swift; do
            base="$(basename "$f")"
            if ! cmp -s "$f" "Tests/CodegenCustomTypesTests/CompileCheck/$base"; then
              echo "::error::CompileCheck/$base diverges from Fixtures/expected/$base. CompileCheck is a byte-for-byte mirror of expected — refresh per Tests/CodegenCustomTypesTests/CompileCheckTests.swift and commit."
              drift=1
            fi
          done
          [[ $drift -eq 0 ]] || exit 1
