name: Spec drift

# Whether the vendored OpenAPI snapshot still matches the monorepo's.
#
# Every wire type is generated from `scripts/openapi.json`, a verbatim copy
# of the monorepo's spec that somebody takes by hand. Nothing watched that
# copy. `freshness` regenerates against it rather than re-syncing it, and
# `RouteCoverageTests` compares the SDK against that same file, so both stay
# green over a snapshot that stopped tracking the platform months ago — and
# the check that looks like it would catch this is the one that cannot, by
# construction. The install route changed shape on both sides while all of
# it was green.
#
# **Scheduled rather than a `freshness` variant.** Re-syncing inside
# `freshness` would fail every time the monorepo's spec moves ahead of an
# unrefreshed snapshot, which is the ordinary state between a platform
# change and the sync that follows it — so it would go red on pull requests
# that have nothing to do with the spec, and the fix would be to ignore it.
# A scheduled job asks the same question without holding anybody's branch
# hostage to the answer, and the alert it raises is keyed, so a snapshot
# left trailing for a week reports once rather than daily.
#
# Daily rather than weekly: the snapshot's input moves on the order of days,
# and the cost of a stale one is paid by whoever ships next.

on:
  schedule:
    # Early UTC, so a finding is waiting at the start of the day. Offset from
    # the monorepo's own drift guard rather than sharing its minute; the two
    # watch different pairs of files and there is nothing to gain from them
    # reporting together.
    - cron: "41 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPEC_SOURCE_REPO: withmarfa/marfa
  # The repository the comparison is mandatory on. A fork or a self-hoster's
  # copy cannot hold the credential, so it skips rather than failing on
  # something it has no way to fix.
  SPEC_CANONICAL_REPO: withmarfa/swift-sdk

jobs:
  drift:
    name: Vendored spec matches the monorepo
    # Hosted, not the pool. This reads one file through the API and builds
    # nothing, so it needs no Xcode and no local machine — and a report that
    # cannot run when the pool is busy is a report nobody can rely on. It
    # also removes the queue-limit cancellation the pool makes possible,
    # which is a state this job would otherwise have to interpret.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `drift` and `error` both fail the job, so the status is right either
    # way; this is how the notifier tells them apart, because "the snapshot
    # is behind" and "the comparison never happened" want different
    # responses and a job result cannot distinguish them.
    outputs:
      verdict: ${{ steps.compare.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the vendored snapshot against the monorepo's spec
        id: compare
        env:
          # Reaches `withmarfa/marfa`, which the built-in `GITHUB_TOKEN`
          # cannot: that token is scoped to this repository alone and both
          # are private. This is an organization secret already visible to
          # every private repository in the org, so nothing new is
          # provisioned for this check. It is named for the guard it was
          # first cut for; the indirection here is one line to repoint if it
          # is ever renamed for what it actually is.
          GH_TOKEN: ${{ secrets.SHIPPING_GAP_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${SPEC_CANONICAL_REPO}" ]; then
              echo "verdict=error" >> "$GITHUB_OUTPUT"
              echo "::error title=Drift guard cannot run::SHIPPING_GAP_TOKEN is not set on ${GITHUB_REPOSITORY}, so the vendored snapshot was never compared against ${SPEC_SOURCE_REPO}. Failing rather than passing: a guard that cannot run must not report green."
              exit 1
            fi
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cross-repo check skipped::SHIPPING_GAP_TOKEN is not set on ${GITHUB_REPOSITORY}, which is not ${SPEC_CANONICAL_REPO}."
            exit 0
          fi

          # A step's default shell is `bash -e`, so a bare call here ended the
          # step the moment the comparison found drift — before the verdict
          # below was ever written. The notifier then read no verdict at all
          # and reported "did not run" for the one outcome this guard exists
          # to announce. Disabled around the call alone; the exit code is
          # re-raised below, so the job status is unchanged.
          set +e
          scripts/spec-drift.sh
          code=$?
          set -e

          # 0 match, 1 drift, anything else the script could not answer. The
          # output is written before the exit so it survives a failing step.
          case "$code" in
            0) echo "verdict=match" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=drift" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=error" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$code"

  notify:
    needs: [drift]
    # Skipped when no alert destination is configured, so a fork sends
    # nothing. Gated on the variable rather than the token because `secrets`
    # is not available in an `if:` at any level, while `vars` is.
    #
    # A dispatch of `main` reports as well as the schedule: when this guard
    # fails, re-running it is how anybody establishes the refresh landed, and
    # a run that cannot clear the alert it raised leaves one outliving its
    # condition. `main` is load-bearing — this alert key is the repository's
    # state, and a branch's snapshot is not that.
    if: >-
      always() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'))
      && vars.ALERT_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report outcome
        env:
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          RESULT: ${{ needs.drift.result }}
          VERDICT: ${{ needs.drift.outputs.verdict }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `failure` is the ordinary finding here rather than a fault: the
          # script exits non-zero when the snapshot trails, which is a thing
          # to go and do. The two are separated because "the snapshot is
          # behind" and "the check could not run" want different responses,
          # and `skipped` sits with `cancelled` rather than falling through
          # to the catch-all — a job that did not run is not a job that ran
          # green, and reporting one as the other is how a guard goes dark
          # quietly.
          # The verdict leads, because the job result cannot separate the two
          # ways this fails. A snapshot that trails is a finding and names the
          # work; a comparison that could not happen says nothing about the
          # snapshot at all, and reporting the second as the first sends
          # somebody to refresh a file that may already be current.
          case "$VERDICT" in
            match)
              STATE=resolved
              TITLE="The vendored spec matches the monorepo"
              ;;
            drift)
              STATE=open
              TITLE="The vendored spec trails the monorepo"
              ;;
            skipped)
              STATE=resolved
              TITLE="The vendored spec check is not configured here"
              ;;
            error)
              STATE=open
              TITLE="The vendored spec could not be compared"
              ;;
            *)
              # No verdict at all: the job was cancelled, skipped, or died
              # before the comparison step wrote one.
              STATE=open
              TITLE="The vendored spec check did not run"
              ;;
          esac

          # Built rather than hardcoded: an unset token would otherwise be
          # sent as "Bearer " with nothing after it, which reads as a
          # malformed request rather than an unauthenticated one.
          AUTH=()
          if [ -n "${ALERT_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $ALERT_TOKEN")
          fi

          # Keyed on the repository's state rather than per run, so one alert
          # opens when the snapshot falls behind and the next run that finds
          # it current resolves it.
          jq -n --arg t "$TITLE" --arg s "$STATE" --arg k "github/$REPO/$WORKFLOW" \
                --arg u "$RUN_URL" --arg r "$REPO" --arg w "$WORKFLOW" --arg j "$RESULT" \
                --arg v "${VERDICT:-none}" \
            '{source:"github",severity:"warning",title:$t,state:$s,key:$k,link:$u,
              fields:{Repository:$r,Workflow:$w,Report:$j,Verdict:$v}}' \
          | curl -sS --fail-with-body --max-time 20 -X POST "$ALERT_URL" \
              "${AUTH[@]}" \
              -H "Content-Type: application/json" --data @- \
          || echo "Alert POST did not succeed (see above); not failing the run over it."
