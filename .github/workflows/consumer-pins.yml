name: Consumer pins

# Which SDK version each Swift consumer pins, and whether any is behind.
#
# Both apps pin `exactVersion` deliberately: neither auto-upgrades and
# neither breaks when a new SDK ships. The cost is silence — a consumer
# never notices the SDK moving, so the distance grows and nothing reports
# it. One app sat a major and two minors behind for weeks and what surfaced
# it was a stock-take.
#
# Lives here rather than in each app because this repository is the one
# that knows what "latest" means, and because one job answering for every
# consumer is the question somebody actually asks. An app checking only
# itself would need the same list maintained twice.

on:
  schedule:
    # Weekly. The thing being watched moves on the order of weeks, and a
    # daily report on a number that rarely changes is how a report stops
    # being read.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: consumer-pins
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The repository this check is mandatory on. A fork cannot hold the
  # credential, so it skips rather than failing on something it has no way
  # to fix.
  PINS_CANONICAL_REPO: withmarfa/swift-sdk

jobs:
  pins:
    name: Report each consumer's pin
    # Hosted, not the pool. This reads two repositories through the API and
    # builds nothing, so it needs no Xcode and no local machine — and a
    # report that cannot run when the pool is busy is a report nobody can
    # rely on.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The findings, so the alert can state them. A job result is one bit and
    # every consumer, version and reason collapses into it: the notifier
    # used to receive the literal string `failure` and could say no more
    # than "a consumer is behind".
    #
    # `verdict` carries the distinction the job result cannot. A consumer
    # sitting behind and a report that never ran both fail the job, and they
    # want different responses — one names the version to move to, the other
    # says only that nobody currently knows.
    outputs:
      verdict: ${{ steps.pins.outputs.verdict }}
      detail: ${{ steps.pins.outputs.detail }}
      consumers: ${{ steps.pins.outputs.consumers }}
      latest: ${{ steps.pins.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare each consumer's pin against the newest tag
        id: pins
        env:
          # The built-in token cannot answer this question. It is scoped to
          # this repository alone, and both consumers are private, so the
          # contents read that recovers each pin 404s — which the script
          # cannot distinguish from a project file that moved, so it reports
          # every consumer as unreadable and fails. That is a false finding
          # on the one check whose whole purpose is to be believed.
          #
          # `SHIPPING_GAP_TOKEN` is an organization secret visible to every
          # private repository in the org and already reaches both consumers:
          # the workbench's shipping-gap guard reads their tags and commits
          # through it, under the same Contents permission the contents
          # endpoint needs.
          #
          # **No fallback to the built-in token.** Falling back would re-arm
          # exactly the false finding this replaced: the run would look
          # configured, read nothing, and report both consumers as behind.
          # An unset credential fails here and skips everywhere else, which
          # is the same position the spec-drift guard takes.
          GH_TOKEN: ${{ secrets.SHIPPING_GAP_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${PINS_CANONICAL_REPO}" ]; then
              echo "verdict=error" >> "$GITHUB_OUTPUT"
              echo "::error title=Pin report cannot run::SHIPPING_GAP_TOKEN is not set on ${GITHUB_REPOSITORY}, so no consumer's pin was read. Failing rather than passing, and rather than falling back to a token that cannot see the consumers and would report every one of them as behind."
              exit 1
            fi
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cross-repo check skipped::SHIPPING_GAP_TOKEN is not set on ${GITHUB_REPOSITORY}, which is not ${PINS_CANONICAL_REPO}."
            exit 0
          fi

          # A step's default shell is `bash -e`, so a bare call to a script
          # that exits non-zero ends the step right there — before any of the
          # lines below run, and those lines are the whole reason the alert
          # can name a consumer. Disabled around the call alone, and the
          # script's own exit code is re-raised at the end, so the job status
          # is exactly what it was.
          log="${RUNNER_TEMP}/consumer-pins.log"
          set +e
          scripts/consumer-pins.sh 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e

          # **The script's stdout is an interface now.** These values exist
          # nowhere else — the script reports to the run log and returns an
          # exit code — so the three patterns below read that log, and
          # tidying a line in `scripts/consumer-pins.sh` empties the alert
          # without breaking anything a test or a lint would notice. Change
          # the log and change these together, or give the script the output
          # directly and delete this.
          latest=$(sed -n 's/^swift-sdk latest: //p' "$log" | head -1)
          behind=$(sed -n 's|^  [^/]*/\([^:]*\): \([0-9][^ ]*\) — behind .*|\1 on \2|p' \
            "$log" | awk 'NR > 1 { printf ", " } { printf "%s", $0 } END { print "" }')
          unreadable=$(sed -n 's|^  [^/]*/\([^:]*\): pin could not be read.*|\1 pin unreadable|p' \
            "$log" | awk 'NR > 1 { printf ", " } { printf "%s", $0 } END { print "" }')
          consumers=$(sed -n \
            -e 's|^  \([^ :]*/[^:]*\): [0-9][^ ]* — behind .*|\1|p' \
            -e 's|^  \([^ :]*/[^:]*\): pin could not be read.*|\1|p' \
            "$log" | awk 'NR > 1 { printf " " } { printf "%s", $0 } END { print "" }')

          case "$code" in
            0) verdict=current ;;
            1) verdict=behind ;;
            *) verdict=error ;;
          esac

          # `latest is ...` only earns its place beside a pin that was
          # actually compared against it. A pin nothing could read has no
          # version to be behind, so naming the newest release next to it
          # describes a comparison that never happened.
          detail=""
          if [ -n "$behind" ]; then
            detail="$behind, latest is ${latest:-unknown}"
          fi
          if [ -n "$unreadable" ]; then
            detail="${detail:+$detail; }$unreadable"
          fi

          # A non-zero exit that named no consumer at all is not a consumer
          # falling behind. The script runs under `set -euo pipefail`, so a
          # `gh api` call that fails takes it down at exit 1 before it has
          # printed a single consumer line — the credential-shaped failure,
          # and the likeliest one. Reported as inconclusive, because the
          # alternative is an alert reading "Swift consumers:" with nothing
          # after the colon, which is the empty alert this work removed.
          if [ -z "$detail" ] && [ "$verdict" = behind ]; then
            verdict=error
          fi

          {
            echo "verdict=$verdict"
            echo "detail=$detail"
            echo "consumers=$consumers"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

          exit "$code"

  notify:
    needs: [pins]
    # Skipped when no alert destination is configured, so a fork sends
    # nothing. Gated on the variable rather than the token because
    # `secrets` is not available in an `if:` at any level, while `vars` is.
    if: always() && vars.ALERT_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report outcome
        env:
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          VERDICT: ${{ needs.pins.outputs.verdict }}
          DETAIL: ${{ needs.pins.outputs.detail }}
          CONSUMERS: ${{ needs.pins.outputs.consumers }}
          LATEST: ${{ needs.pins.outputs.latest }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # A cancelled run reached no conclusion about anything, and this
          # workflow cancels in progress — so dispatching it while the
          # schedule is mid-run kills that run. Reporting the cancellation
          # somebody just caused as a check that could not run is noise.
          case ",$RESULTS," in
            *,cancelled,*) exit 0 ;;
          esac

          # `failure` is the ordinary case here rather than a fault: the
          # script exits non-zero when a consumer is behind, which is a
          # finding and not a broken job. The verdict leads, because the job
          # result cannot separate the two and they want different responses
          # — "a consumer is behind" names the consumer, the version it sits
          # on and the version to move to, while "the check could not run"
          # says nothing about any consumer and must not be dressed up as
          # though it did.
          case "$VERDICT" in
            behind)
              STATE=open
              TITLE="Swift consumers: $DETAIL"
              ;;
            current)
              STATE=resolved
              TITLE="Swift consumers: current"
              ;;
            skipped)
              # A checkout with no credential compared nothing and has no
              # opinion on consumers it never read. Silence rather than a
              # third state: this alert is the canonical repository's, and
              # there an unset credential fails loudly instead.
              echo "The pin comparison did not run here; sending nothing."
              exit 0
              ;;
            *)
              # `error`, or no verdict at all because the job was cancelled
              # or died before the step wrote one.
              STATE=open
              TITLE="Swift consumer check: inconclusive"
              ;;
          esac

          # Built rather than hardcoded: an unset token would otherwise be
          # sent as "Bearer " with nothing after it, which reads as a
          # malformed request rather than an unauthenticated one.
          AUTH=()
          if [ -n "${ALERT_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $ALERT_TOKEN")
          fi

          # Titles stay plain prose, so everything the title names is linked
          # here instead. The consumers are a space-separated list of full
          # repository names; the title carries their short names.
          CONSUMER_LINKS=""
          read -ra consumer_list <<< "$CONSUMERS"
          for consumer in "${consumer_list[@]}"; do
            CONSUMER_LINKS="${CONSUMER_LINKS:+$CONSUMER_LINKS, }[${consumer##*/}]($SERVER_URL/$consumer)"
          done

          # Keyed on the estate's state rather than per run, so one alert
          # opens when a consumer falls behind and the next run that finds
          # everything current resolves it.
          #
          # **`github.workflow` is this workflow's display name, not its
          # filename.** Renaming `name:` at the top of this file re-keys
          # every alert it sends: whatever it had open can no longer be
          # resolved, and downstream filtering on the old string stops
          # matching without anything reporting that it has.
          BODY="$(
            jq -n --arg t "$TITLE" --arg s "$STATE" --arg k "github/$REPO/$WORKFLOW" \
                  --arg u "$RUN_URL" --arg w "$WORKFLOW" \
                  --arg r "[$REPO]($SERVER_URL/$REPO)" \
                  --arg n "[#$RUN_NUMBER]($RUN_URL)" \
                  --arg c "${CONSUMER_LINKS:-none}" \
                  --arg l "${LATEST:-unknown}" \
                  --arg v "${VERDICT:-none}" \
              '{source:"github",severity:"warning",title:$t,state:$s,key:$k,link:$u,
                fields:{Repository:$r,Workflow:$w,Run:$n,Consumers:$c,Latest:$l,Verdict:$v}}'
          )" || {
            echo "::error::The alert body could not be built. Nothing was sent."
            exit 1
          }
          if [ -z "$BODY" ]; then
            echo "::error::The alert body came out empty. Nothing was sent."
            exit 1
          fi

          printf '%s' "$BODY" \
          | curl -sS --fail-with-body --max-time 20 -X POST "$ALERT_URL" \
              "${AUTH[@]}" \
              -H "Content-Type: application/json" --data @- \
          || echo "Alert POST did not succeed (see above); not failing the run over it."
