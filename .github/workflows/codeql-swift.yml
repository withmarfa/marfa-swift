name: CodeQL Swift

# Swift is analyzed on macOS, where the runner is scarce, so the whole tree is
# analyzed once a week and by hand, never on a pull request or a push. On a
# pull request it ran beside `ci.yml` and rebuilt the core that run was still
# building. Monday's run comes after the daily pin bump, which keeps the core
# for the pin on `main`, so it builds none. `codeql.yml` analyzes the
# workflows.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# One run at a time, and a run is never cancelled for a later one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CodeQL reads Swift from a build it watches, and the package builds only
  # beside the core's framework: the one `pin-bump.yml` and `ci.yml` keep for
  # this pin, or one built here when that has gone.
  swift:
    name: Analyze (swift)
    runs-on: xcode-27
    # Twice the 90th percentile of a run that builds the core (27 minutes).
    timeout-minutes: 55
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      # The paths and the key are `ci.yml`'s, since both make one cache's name.
      - name: Restore what the pin generates
        id: core
        uses: actions/cache@v6
        with:
          path: |
            Frameworks/MarfaCoreFFI.xcframework
            Sources/MarfaCore
            Sources/MarfaTypes
            Sources/MarfaAPI/Generated
          key: core-output-${{ runner.os }}-${{ hashFiles('core.pin', 'scripts/core.sh', 'generator/**') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the core at the pin
        if: ${{ steps.core.outputs.cache-hit != 'true' }}
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          scripts/core.sh

      # Before CodeQL watches, so only the build is traced. Outside the
      # checkout, so the dependencies' sources are not reported as its own.
      - name: Resolve the dependencies
        run: swift package resolve --scratch-path "${RUNNER_TEMP}/swift-build"
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      # The library targets alone. Traced, a build that does not name its
      # architecture picks no slice of the core's framework and cannot import
      # it; CodeQL advises one architecture. On macOS 27 the tracer cannot
      # start `sandbox-exec` ("Bad CPU type"), so the manifest runs unsandboxed.
      - name: Build the package
        run: swift build --arch arm64 --disable-sandbox --scratch-path "${RUNNER_TEMP}/swift-build"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
