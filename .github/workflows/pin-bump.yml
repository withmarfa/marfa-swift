name: Bump the core pin

# Moves `core.pin` to marfa's `main` once a day. The checks on a pull request
# that the GitHub token opens wait for someone with write access to approve
# them, so the bump is opened with the token of the WithMarfa Bot app, made
# after the build and limited to contents and pull requests. Merging the bump runs the
# release (`pin-bump-release.yml`). A bump whose checks fail stays open, and
# an open pull request that changes `core.pin` stops a second one opening.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Move the pin and build in this run, without pushing or opening a pull request
        type: boolean
        default: true

concurrency:
  group: pin-bump
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  BRANCH: automation/core-pin

jobs:
  bump:
    name: Open the pin bump
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MARFA_MONOREPO: ${{ github.workspace }}/.build/marfa
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/core-target
      MARFA_GENERATOR_BUILD: ${{ github.workspace }}/.build/generator-build
    steps:
      - name: Refuse any branch but main
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::A pin bump is made from main only, and this run is on ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(tr -d '[:space:]' < core.pin)"
          head="$(git ls-remote https://github.com/withmarfa/marfa refs/heads/main | cut -f1)"
          ci="$(gh run list --repo withmarfa/marfa --workflow ci.yml --branch main --event push \
            --commit "${head}" --json status,conclusion \
            --jq 'if length == 0 then "none" elif .[0].status != "completed" then "pending" else .[0].conclusion end')"
          open="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --json files \
            --jq '[.[] | select(any(.files[]; .path == "core.pin"))] | length')"
          result="$(scripts/pin-bump.sh decide "${current}" "${head}" "${ci}" "${open}")"
          echo "${result}"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          if [[ "${result}" == bump ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "${result}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select Xcode
        if: ${{ steps.decide.outputs.bump == 'true' }}
        run: |
          if [[ ! -d /Applications/Xcode.app ]]; then
            echo "::error::This hosted runner has no /Applications/Xcode.app."
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Add the iOS targets
        if: ${{ steps.decide.outputs.bump == 'true' }}
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: actions/setup-node@v7
        if: ${{ steps.decide.outputs.bump == 'true' }}
        with:
          node-version: 22

      - name: Check out the core at the new pin
        if: ${{ steps.decide.outputs.bump == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: withmarfa/marfa
          ref: ${{ steps.decide.outputs.head }}
          path: .build/marfa
          persist-credentials: false

      - name: Move the pin and regenerate
        if: ${{ steps.decide.outputs.bump == 'true' }}
        env:
          HEAD: ${{ steps.decide.outputs.head }}
        run: |
          echo "${HEAD}" > core.pin
          scripts/core.sh

      - name: Build
        if: ${{ steps.decide.outputs.bump == 'true' }}
        run: swift build

      # Made only now, so no build step runs with it in its environment.
      # Contents write still reaches every branch and tag in this repository.
      - uses: actions/create-github-app-token@v3
        id: app
        if: ${{ steps.decide.outputs.bump == 'true' && (github.event_name == 'schedule' || !inputs.dry_run) }}
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        if: ${{ steps.decide.outputs.bump == 'true' && (github.event_name == 'schedule' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD: ${{ steps.decide.outputs.head }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          short="${HEAD:0:7}"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add -A -- core.pin Sources
          git commit -q -m "chore(package): build against marfa ${short}"
          # Decide found no open pull request that changes the pin, so a branch
          # left by one closed by hand is nobody's.
          header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${header}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${header}" \
            git push -q --force origin "${BRANCH}"
          {
            echo "## Summary"
            echo
            echo "Moves \`core.pin\` to marfa \`${short}\`, the head of marfa's \`main\` with a green \`ci.yml\` run, and regenerates the glue and the wire types it generates."
            echo
            echo "## Changes"
            echo
            echo "- \`core.pin\` names \`${HEAD}\`."
            echo "- \`Sources/MarfaCore\` and \`Sources/MarfaTypes\` are what that commit generates."
            echo
            echo "## Testing"
            echo
            echo "The core built at the new pin and \`swift build\` passed in this run. The required checks run on this pull request in full, and it merges when they pass. It adds no behavior of its own, so it adds no test."
            echo
            echo "## Notes for reviewers"
            echo
            echo "Opened by the \`Bump the core pin\` workflow. Merging it runs the release. A bump whose checks fail stays open, and no second one is opened beside it."
            echo
            echo "## Checklist"
            echo
            echo "- [x] The title is a scoped Conventional Commit."
            echo "- [x] New behavior has a test that was seen failing first, or no test was needed and the reason is above."
            echo "- [x] Docs, comments and the contract still say what is true after this change."
          } > "${RUNNER_TEMP}/body.md"
          url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
            --title "chore(package): build against marfa ${short}" --body-file "${RUNNER_TEMP}/body.md")"
          gh pr merge "${url##*/}" --repo "${GITHUB_REPOSITORY}" --squash --auto --delete-branch
