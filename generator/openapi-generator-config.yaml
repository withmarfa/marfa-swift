# Types only: the models, the operation inputs and outputs, and nothing that
# sends a request. The working copy talks through the core's own transport.
generate:
  - types
accessModifier: public
namingStrategy: idiomatic
# The generator cannot express a map whose values are any of several scalars
# or null (the version `Package.swift` here pins emits a payload that does not
# compile), so the report is read as the free-form object it is.
typeOverrides:
  schemas:
    HousekeepingReport: OpenAPIRuntime.OpenAPIObjectContainer
